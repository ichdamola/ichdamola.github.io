<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID WARS | 4×4 Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-cream: #f5f0e8;
            --bg-paper: #ebe6dc;
            --ink-black: #1a1a1a;
            --ink-faded: #4a4a4a;
            --player-one: #c41e3a;
            --player-two: #1e3a5f;
            --accent-gold: #c9a227;
            --grid-line: #2a2a2a;
            --shadow: rgba(26, 26, 26, 0.15);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ink-black);
            position: relative;
            overflow-x: hidden;
        }

        /* Newspaper texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        /* Diagonal stripes corner decoration */
        body::after {
            content: '';
            position: fixed;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: repeating-linear-gradient(
                -45deg,
                var(--player-one),
                var(--player-one) 8px,
                transparent 8px,
                transparent 16px
            );
            opacity: 0.1;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
            max-width: 700px;
        }

        /* Header - Newspaper masthead style */
        .header {
            text-align: center;
            border-bottom: 3px double var(--ink-black);
            padding-bottom: 1rem;
            width: 100%;
            position: relative;
        }

        .header::before {
            content: '★ ESTABLISHED 2026 ★';
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: var(--ink-faded);
            display: block;
            margin-bottom: 0.3rem;
        }

        .title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4.5rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: var(--ink-black);
            line-height: 0.9;
            text-transform: uppercase;
        }

        .title span {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2rem;
            display: block;
            letter-spacing: 0.05em;
            color: var(--player-one);
            margin-top: -0.3rem;
        }

        .subtitle {
            font-size: 0.7rem;
            color: var(--ink-faded);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-top: 0.8rem;
            border-top: 1px solid var(--ink-faded);
            padding-top: 0.5rem;
        }

        /* Score section - Boxing match style */
        .scoreboard {
            display: flex;
            align-items: stretch;
            width: 100%;
            background: var(--bg-paper);
            border: 2px solid var(--ink-black);
            position: relative;
        }

        .scoreboard::before {
            content: 'SCOREBOARD';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-cream);
            padding: 0 1rem;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--ink-faded);
        }

        .player-score {
            flex: 1;
            padding: 1.2rem 1rem;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .player-score.one {
            background: linear-gradient(135deg, var(--player-one) 0%, #8b1528 100%);
            color: white;
        }

        .player-score.two {
            background: linear-gradient(135deg, var(--player-two) 0%, #0f1f33 100%);
            color: white;
        }

        .player-score.active {
            transform: scale(1.02);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .player-score .label {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .player-score .symbol {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            line-height: 1;
            margin: 0.3rem 0;
        }

        .player-score .wins {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
        }

        .score-divider {
            width: 80px;
            background: var(--accent-gold);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ink-black);
            position: relative;
        }

        .score-divider::before,
        .score-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--ink-black);
        }

        .score-divider::before { top: 0; }
        .score-divider::after { bottom: 0; }

        .score-divider .ties-label {
            font-size: 0.5rem;
            letter-spacing: 0.2em;
        }

        .score-divider .ties-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            line-height: 1;
        }

        /* Status - Ticker tape style */
        .status-wrapper {
            width: 100%;
            background: var(--ink-black);
            padding: 0.6rem 1rem;
            overflow: hidden;
            position: relative;
        }

        .status {
            color: var(--accent-gold);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
            animation: tickerGlow 2s ease-in-out infinite;
        }

        @keyframes tickerGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Game Board - Brutalist grid */
        .board-wrapper {
            position: relative;
            padding: 1.5rem;
            background: var(--bg-paper);
            border: 3px solid var(--ink-black);
            box-shadow: 8px 8px 0 var(--ink-black);
        }

        .board-wrapper::before {
            content: '4×4 GRID BATTLE';
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--accent-gold);
            padding: 0.2rem 0.8rem;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            font-weight: 700;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            background: var(--grid-line);
            padding: 3px;
        }

        .cell {
            width: 85px;
            height: 85px;
            background: var(--bg-cream);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            border: 1px solid var(--grid-line);
        }

        .cell::before {
            content: attr(data-index);
            position: absolute;
            top: 4px;
            left: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.5rem;
            color: var(--ink-faded);
            opacity: 0.4;
        }

        .cell:hover:not(.taken) {
            background: var(--bg-paper);
        }

        .cell:hover:not(.taken)::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px dashed var(--ink-faded);
            opacity: 0.5;
        }

        .cell.taken {
            cursor: not-allowed;
        }

        .cell.x {
            color: var(--player-one);
            animation: stampIn 0.2s cubic-bezier(0.17, 0.67, 0.35, 1.5);
        }

        .cell.o {
            color: var(--player-two);
            animation: stampIn 0.2s cubic-bezier(0.17, 0.67, 0.35, 1.5);
        }

        .cell.winner {
            animation: winnerFlash 0.4s ease-in-out infinite alternate;
            background: var(--accent-gold);
        }

        .cell.winner.x { color: var(--player-one); }
        .cell.winner.o { color: var(--player-two); }

        @keyframes stampIn {
            0% {
                transform: scale(2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes winnerFlash {
            0% { background: var(--accent-gold); }
            100% { background: #e8d48a; }
        }

        /* Controls - Vintage button style */
        .controls {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .btn {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1rem 1.5rem;
            border: 2px solid var(--ink-black);
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            background: var(--bg-cream);
            color: var(--ink-black);
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 3px;
            border: 1px solid var(--ink-black);
            pointer-events: none;
        }

        .btn-primary {
            background: var(--ink-black);
            color: var(--bg-cream);
        }

        .btn-primary::before {
            border-color: var(--bg-cream);
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--ink-black);
        }

        .btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        /* Modal - Wanted poster style */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 26, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-cream);
            padding: 0;
            border: 4px solid var(--ink-black);
            text-align: center;
            transform: scale(0.8) rotate(-2deg);
            transition: transform 0.3s ease;
            max-width: 380px;
            width: 90%;
            position: relative;
            box-shadow: 12px 12px 0 rgba(0,0,0,0.3);
        }

        .modal::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 2px solid var(--ink-black);
            pointer-events: none;
        }

        .modal-overlay.active .modal {
            transform: scale(1) rotate(0deg);
        }

        .modal-header {
            background: var(--ink-black);
            color: var(--bg-cream);
            padding: 0.8rem;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.4em;
        }

        .modal-content {
            padding: 2rem;
        }

        .modal-icon {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .modal-icon.x { color: var(--player-one); }
        .modal-icon.o { color: var(--player-two); }
        .modal-icon.tie { color: var(--accent-gold); }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.3rem;
        }

        .modal-subtitle {
            color: var(--ink-faded);
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.1em;
        }

        .modal-btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.8rem 2rem;
            background: var(--ink-black);
            color: var(--bg-cream);
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .modal-btn:hover {
            background: var(--player-one);
        }

        /* Footer */
        .footer {
            margin-top: 0.5rem;
            color: var(--ink-faded);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Rules sidebar */
        .rules {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--ink-faded);
            opacity: 0.5;
        }

        /* Decorative corner */
        .corner-decoration {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            border-left: 3px solid var(--ink-black);
            border-bottom: 3px solid var(--ink-black);
            opacity: 0.2;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title {
                font-size: 3rem;
            }

            .title span {
                font-size: 1.5rem;
            }

            .cell {
                width: 70px;
                height: 70px;
                font-size: 2.5rem;
            }

            .board-wrapper {
                padding: 1rem;
                box-shadow: 5px 5px 0 var(--ink-black);
            }

            .controls {
                flex-direction: column;
            }

            .rules {
                display: none;
            }

            .player-score .symbol {
                font-size: 2rem;
            }

            .score-divider {
                width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="rules">ALIGN FOUR TO CONQUER • GRID WARS 2026</div>
    <div class="corner-decoration"></div>

    <div class="container">
        <header class="header">
            <h1 class="title">GRID WARS <span>Four by Four</span></h1>
            <p class="subtitle">The Ultimate Strategic Battle • IFT 603 Project</p>
        </header>

        <div class="scoreboard">
            <div class="player-score one" id="score-x">
                <div class="label">Challenger</div>
                <div class="symbol">✕</div>
                <div class="wins" id="x-wins">0</div>
            </div>
            <div class="score-divider">
                <div class="ties-label">DRAWS</div>
                <div class="ties-value" id="ties">0</div>
            </div>
            <div class="player-score two" id="score-o">
                <div class="label">Defender</div>
                <div class="symbol">○</div>
                <div class="wins" id="o-wins">0</div>
            </div>
        </div>

        <div class="status-wrapper">
            <div class="status" id="status">✕ CHALLENGER'S MOVE</div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board">
                <!-- 16 cells for 4x4 grid -->
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
                <div class="cell" data-index="9"></div>
                <div class="cell" data-index="10"></div>
                <div class="cell" data-index="11"></div>
                <div class="cell" data-index="12"></div>
                <div class="cell" data-index="13"></div>
                <div class="cell" data-index="14"></div>
                <div class="cell" data-index="15"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="restart-btn">New Battle</button>
            <button class="btn" id="reset-scores-btn">Clear Records</button>
        </div>

        <footer class="footer">
            Crafted with HTML • CSS • JavaScript
        </footer>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">★ BATTLE CONCLUDED ★</div>
            <div class="modal-content">
                <div class="modal-icon" id="modal-icon">✕</div>
                <h2 class="modal-title" id="modal-title">CHALLENGER WINS!</h2>
                <p class="modal-subtitle" id="modal-subtitle">A decisive victory on the grid</p>
                <button class="modal-btn" id="play-again-btn">REMATCH</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GRID WARS - 4×4 TIC TAC TOE
        // IFT 603 End-of-Semester Assignment
        // ============================================

        // Game Configuration
        const GRID_SIZE = 4;
        const WIN_LENGTH = 4; // Need 4 in a row to win

        // Game State
        let currentPlayer = 'X';
        let gameBoard = Array(GRID_SIZE * GRID_SIZE).fill('');
        let gameActive = true;
        let scores = { X: 0, O: 0, ties: 0 };

        // Generate all winning combinations for 4x4 grid
        function generateWinningCombinations() {
            const combinations = [];
            
            // Rows
            for (let row = 0; row < GRID_SIZE; row++) {
                const rowCombo = [];
                for (let col = 0; col < GRID_SIZE; col++) {
                    rowCombo.push(row * GRID_SIZE + col);
                }
                combinations.push(rowCombo);
            }
            
            // Columns
            for (let col = 0; col < GRID_SIZE; col++) {
                const colCombo = [];
                for (let row = 0; row < GRID_SIZE; row++) {
                    colCombo.push(row * GRID_SIZE + col);
                }
                combinations.push(colCombo);
            }
            
            // Main diagonal (top-left to bottom-right)
            const mainDiag = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                mainDiag.push(i * GRID_SIZE + i);
            }
            combinations.push(mainDiag);
            
            // Anti-diagonal (top-right to bottom-left)
            const antiDiag = [];
            for (let i = 0; i < GRID_SIZE; i++) {
                antiDiag.push(i * GRID_SIZE + (GRID_SIZE - 1 - i));
            }
            combinations.push(antiDiag);
            
            return combinations;
        }

        const winningCombinations = generateWinningCombinations();

        // DOM Elements
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');
        const resetScoresBtn = document.getElementById('reset-scores-btn');
        const modal = document.getElementById('modal');
        const modalIcon = document.getElementById('modal-icon');
        const modalTitle = document.getElementById('modal-title');
        const modalSubtitle = document.getElementById('modal-subtitle');
        const playAgainBtn = document.getElementById('play-again-btn');
        const xWinsDisplay = document.getElementById('x-wins');
        const oWinsDisplay = document.getElementById('o-wins');
        const tiesDisplay = document.getElementById('ties');
        const scoreX = document.getElementById('score-x');
        const scoreO = document.getElementById('score-o');

        // ============================================
        // GAME FUNCTIONS
        // ============================================

        function updateStatus() {
            if (currentPlayer === 'X') {
                statusDisplay.textContent = '✕ CHALLENGER\'S MOVE';
                scoreX.classList.add('active');
                scoreO.classList.remove('active');
            } else {
                statusDisplay.textContent = '○ DEFENDER\'S MOVE';
                scoreO.classList.add('active');
                scoreX.classList.remove('active');
            }
        }

        function handleCellClick(event) {
            const cell = event.target;
            const index = parseInt(cell.getAttribute('data-index'));

            if (gameBoard[index] !== '' || !gameActive) {
                return;
            }

            // Update game state
            gameBoard[index] = currentPlayer;
            cell.textContent = currentPlayer === 'X' ? '✕' : '○';
            cell.classList.add('taken', currentPlayer.toLowerCase());

            // Check for winner or tie
            const winningCombo = checkWinner();
            if (winningCombo) {
                handleWin(winningCombo);
            } else if (checkTie()) {
                handleTie();
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        function checkWinner() {
            for (let combination of winningCombinations) {
                const values = combination.map(index => gameBoard[index]);
                if (values[0] && values.every(val => val === values[0])) {
                    return combination;
                }
            }
            return null;
        }

        function checkTie() {
            return gameBoard.every(cell => cell !== '');
        }

        function handleWin(winningCombo) {
            gameActive = false;
            
            // Highlight winning cells
            winningCombo.forEach(index => {
                cells[index].classList.add('winner');
            });

            // Update score
            scores[currentPlayer]++;
            updateScoreDisplay();

            // Show modal
            setTimeout(() => {
                showModal('win', currentPlayer);
            }, 500);
        }

        function handleTie() {
            gameActive = false;
            scores.ties++;
            updateScoreDisplay();

            setTimeout(() => {
                showModal('tie');
            }, 300);
        }

        function updateScoreDisplay() {
            xWinsDisplay.textContent = scores.X;
            oWinsDisplay.textContent = scores.O;
            tiesDisplay.textContent = scores.ties;
        }

        function showModal(type, winner = null) {
            if (type === 'win') {
                modalIcon.textContent = winner === 'X' ? '✕' : '○';
                modalIcon.className = `modal-icon ${winner.toLowerCase()}`;
                modalTitle.textContent = winner === 'X' ? 'CHALLENGER WINS!' : 'DEFENDER WINS!';
                modalSubtitle.textContent = 'A decisive victory on the grid';
            } else {
                modalIcon.textContent = '—';
                modalIcon.className = 'modal-icon tie';
                modalTitle.textContent = 'STALEMATE!';
                modalSubtitle.textContent = 'The grid remains unconquered';
            }
            modal.classList.add('active');
        }

        function hideModal() {
            modal.classList.remove('active');
        }

        function restartGame() {
            currentPlayer = 'X';
            gameBoard = Array(GRID_SIZE * GRID_SIZE).fill('');
            gameActive = true;

            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x', 'o', 'winner');
            });

            updateStatus();
            hideModal();
        }

        function resetScores() {
            scores = { X: 0, O: 0, ties: 0 };
            updateScoreDisplay();
            restartGame();
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        restartBtn.addEventListener('click', restartGame);
        resetScoresBtn.addEventListener('click', resetScores);
        playAgainBtn.addEventListener('click', restartGame);

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                hideModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                hideModal();
            }
            if (e.key === 'Enter' && modal.classList.contains('active')) {
                restartGame();
            }
        });

        // Initialize
        updateStatus();

        // ============================================
        // END OF JAVASCRIPT
        // ============================================
    </script>
</body>
</html>
